name: DCO

# Every commit of a pull request is signed off by its author (CONTRIBUTING.md).
on:
  pull_request:
  # The "Version packages" pull request is opened with GITHUB_TOKEN, which starts no
  # workflow: a maintainer runs this by hand on its branch (docs/releasing.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    # Bot pull requests ("Version packages") carry no sign-off; a skipped job counts as passed.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The check's own scripts come from the base branch, so a pull request can't change
      # the rules it is checked by. Only a pull request that adds them runs its own copy.
      - name: Take the check from the base branch
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          for f in dco.mjs check-dco.mjs; do
            git show "origin/$BASE_REF:scripts/$f" > "$RUNNER_TEMP/$f" 2>/dev/null || cp "scripts/$f" "$RUNNER_TEMP/$f"
          done
        env:
          BASE_REF: ${{ github.base_ref }}
      # The range is against the base branch as it is now, so commits merged into the
      # pull request from it ("Update branch") are not counted as the pull request's.
      - run: node "$RUNNER_TEMP/check-dco.mjs" "origin/$BASE_REF" HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
          # Agent-authored commits pass only on a maintainer's own pull request, from this repository.
          MAINTAINER_PR: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && github.event.pull_request.head.repo.full_name == github.repository }}

  # Run by hand on changeset-release/master: passes only when every commit there that
  # master lacks is the release workflow's own (no person's commit to sign off).
  release-branch:
    name: dco
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only the release workflow's commits
        run: |
          case "$GITHUB_REF_NAME" in changeset-release/*) ;; *) echo "::error::run by hand only on a changeset-release/ branch"; exit 1;; esac
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          others=$(git log --format='%h %ae %ce' origin/master..HEAD | awk -v bot="$bot" '$2 != bot || $3 != "noreply@github.com" && $3 != bot')
          if [ -n "$others" ]; then echo "::error::commits not made by the release workflow need a pull request of their own:"; echo "$others"; exit 1; fi
          echo "$(git rev-list --count origin/master..HEAD) commit(s), all from the release workflow"
