name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Until the NPM_TOKEN secret is added, the workflow does nothing.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Opens a "Version packages" PR when changesets are pending; publishes when that PR is merged.
      - uses: changesets/action@v1
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: npx changeset version
          # While in prerelease mode (.changeset/pre.json), alphas go to the `next` dist-tag, so
          # `npm i sf-agent-qa` keeps giving the latest stable release.
          publish: ${{ hashFiles('.changeset/pre.json') != '' && 'npm run release -- --tag next' || 'npm run release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only works in CI, so it's set here rather than in package.json.
          NPM_CONFIG_PROVENANCE: true
