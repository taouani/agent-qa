name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Until the NPM_TOKEN secret is added, the workflow does nothing.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Opens a "Version packages" PR when changesets are pending; publishes when that PR is merged.
      - uses: changesets/action@v1
        id: changesets
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: npx changeset version
          # In prerelease mode (.changeset/pre.json) this publishes to the pre tag (alpha);
          # changesets refuses a custom --tag in pre mode, so `next` is added below.
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed build provenance on npm (the repository is public).
          NPM_CONFIG_PROVENANCE: true
      # Prereleases also go on the `next` dist-tag, so `npm i sf-agent-qa@next` gets them
      # and `npm i sf-agent-qa` keeps giving the latest stable release.
      - name: Tag the prerelease as next
        if: steps.changesets.outputs.published == 'true' && hashFiles('.changeset/pre.json') != ''
        run: npm dist-tag add "sf-agent-qa@$(node -p "require('./package.json').version")" next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # A stable release (pre mode exited): `next` follows it, so `npm i sf-agent-qa@next`
      # never gives something older than `latest`, and the empty 0.0.0 placeholder is
      # deprecated (decision 6a). Both are safe to run again.
      - name: Point next at the stable release, deprecate 0.0.0
        if: steps.changesets.outputs.published == 'true' && hashFiles('.changeset/pre.json') == ''
        run: |
          npm dist-tag add "sf-agent-qa@$(node -p "require('./package.json').version")" next
          npm deprecate sf-agent-qa@0.0.0 "Placeholder. Install sf-agent-qa@latest (Agent-QA v2)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
